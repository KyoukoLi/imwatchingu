<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d0d13">
<title>私生模拟器</title>
<style>
:root{
  --bg:#0d0d13; --bg2:#15151e; --card:#1b1b27; --card2:#222234;
  --line:#2e2e42; --txt:#e8e6f0; --txt2:#9b97ad; --txt3:#6c6880;
  --pink:#ff4d8d; --pink-dim:#ff4d8d33; --violet:#8b7cf6;
  --gold:#f2c14e; --green:#4ecf8b; --red:#ff5c5c; --blue:#5cb3ff;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000}
body{font-family:-apple-system,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;color:var(--txt);display:flex;justify-content:center}
#phone{width:100%;max-width:430px;height:100%;height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
@media(min-width:431px){#phone{border-left:1px solid #1c1c28;border-right:1px solid #1c1c28}}

/* ---------- status bar ---------- */
#statusbar{flex:none;padding:10px 14px 8px;background:var(--bg2);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:7px}
#sb-top{display:flex;align-items:center;gap:10px;font-size:13px}
#sb-day{font-weight:700;color:var(--pink);letter-spacing:.5px}
#sb-stats{display:flex;gap:12px;margin-left:auto;color:var(--txt2);font-size:12.5px}
#sb-stats b{color:var(--txt);font-weight:600}
#riskwrap{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--txt3)}
#riskbar{flex:1;height:6px;background:#26263a;border-radius:3px;overflow:hidden}
#riskfill{height:100%;width:0%;border-radius:3px;background:var(--green);transition:width .5s,background .5s}
#risknum{min-width:54px;text-align:right;font-variant-numeric:tabular-nums}

/* ---------- screen ---------- */
#screen{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:14px 14px 20px;scroll-behavior:smooth}
#screen::-webkit-scrollbar{width:0}

/* ---------- tab bar ---------- */
#tabbar{flex:none;display:flex;background:var(--bg2);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0;border:none;background:none;color:var(--txt3);font-size:10.5px;cursor:pointer;position:relative}
.tab .ti{font-size:19px;line-height:1}
.tab.on{color:var(--pink)}
.tab .dot{position:absolute;top:2px;right:24%;width:7px;height:7px;border-radius:50%;background:var(--red);display:none}
.tab .dot.show{display:block}

/* ---------- common ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h4{font-size:13px;color:var(--txt2);font-weight:600;margin-bottom:8px;letter-spacing:.5px}
.narr{font-size:14.5px;line-height:1.85;color:var(--txt);white-space:pre-wrap}
.narr .hint{color:var(--txt3);font-style:italic}
.narr .em{color:var(--pink)}
.narr .warn{color:var(--gold)}
.sys{font-size:12px;color:var(--txt3);text-align:center;margin:10px 0;letter-spacing:.5px}
.btn{display:block;width:100%;border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:12px;padding:12px 14px;font-size:14px;text-align:left;cursor:pointer;margin-bottom:9px;transition:transform .06s,border-color .15s;line-height:1.5}
.btn:active{transform:scale(.98)}
.btn .sub{display:block;font-size:11.5px;color:var(--txt3);margin-top:3px}
.btn.primary{border-color:var(--pink);background:linear-gradient(0deg,var(--pink-dim),var(--pink-dim)),var(--card2)}
.btn.ghost{background:none;text-align:center;color:var(--txt2)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn:disabled:active{transform:none}
/* ---------- choice panel：可点区域与叙事流明确区分 ---------- */
.choices{background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--pink);border-radius:14px;padding:12px 12px 4px;margin-bottom:12px}
.choices .ctitle{font-size:11.5px;color:var(--txt3);letter-spacing:1.5px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.choices .ctitle::after{content:"";flex:1;height:1px;background:var(--line)}
.choices .btn{position:relative;padding-right:30px}
.choices .btn:not(:disabled)::after{content:"›";position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--txt3);font-size:16px}
.choices .btn.primary:not(:disabled)::after{color:var(--pink)}
.cgroup{font-size:10.5px;color:var(--txt3);letter-spacing:1px;margin:10px 2px 7px;display:flex;align-items:center;gap:8px}
.cgroup::before,.cgroup::after{content:"";flex:1;height:1px;background:var(--line)}
.btn .lock{color:var(--gold);font-style:normal}
.doneline{font-size:11.5px;color:var(--txt3);padding:4px 2px 9px}
.doneline b{color:var(--txt2);font-weight:600}
/* 你的选择回执 */
.receipt{display:flex;justify-content:flex-end;margin:2px 0 12px}
.receipt span{max-width:85%;background:var(--pink-dim);border:1px solid var(--pink);color:var(--txt);border-radius:12px 4px 12px 12px;padding:7px 12px;font-size:13px;line-height:1.5}
/* 已读内容弱化 */
.past{opacity:.5;transition:opacity .4s}
/* 素材入库卡 */
.gaincard{display:flex;gap:11px;align-items:center;background:linear-gradient(90deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:13px;padding:11px 13px;margin-bottom:12px}
.gaincard .gicon{flex:none;width:42px;height:42px;border-radius:11px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:20px}
.gaincard .ginfo{flex:1;min-width:0}
.gaincard .gname{font-size:13.5px;font-weight:600}
.gaincard .gmeta{font-size:11px;color:var(--txt3);margin-top:2px}
.gaincard.glv4{border-color:var(--gold)} .gaincard.glv5{border-color:var(--red)}
/* 顶栏数值脉冲与飘字 */
@keyframes statpulse{0%{transform:scale(1)}35%{transform:scale(1.25)}100%{transform:scale(1)}}
#sb-stats b.pulse-up{animation:statpulse .5s;color:var(--green)}
#sb-stats b.pulse-down{animation:statpulse .5s;color:var(--red)}
#statfloats{position:absolute;top:34px;right:12px;z-index:40;pointer-events:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.sfloat{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:#000a;animation:sfloat 1.4s ease forwards}
.sfloat.up{color:var(--green)} .sfloat.down{color:var(--red)}
@keyframes sfloat{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
/* 底部「有新选项」提示 */
#morehint{position:absolute;bottom:calc(64px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:30;background:var(--pink);color:#fff;font-size:11.5px;padding:6px 14px;border-radius:99px;box-shadow:0 4px 14px #0008;cursor:pointer;display:none;animation:fadein .3s}
#morehint.show{display:block}
.pillrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.pill{font-size:11px;padding:3px 9px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--txt2)}
.pill.hot{color:var(--pink);border-color:var(--pink)}
.delta{font-size:12.5px;line-height:1.9;color:var(--txt2)}
.delta b{font-weight:600}
.up{color:var(--green)} .down{color:var(--red)} .gd{color:var(--gold)}

/* ---------- qte ---------- */
#qtewrap{margin:10px 0 4px}
#qtebar{height:8px;background:#26263a;border-radius:4px;overflow:hidden}
#qtefill{height:100%;width:100%;background:var(--gold);border-radius:4px}
@keyframes qte{from{width:100%}to{width:0%}}
.qtelabel{font-size:11px;color:var(--gold);margin-bottom:5px;text-align:center;letter-spacing:2px}

/* ---------- chat / feed ---------- */
.chatmsg{display:flex;gap:9px;margin-bottom:13px}
.avatar{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;background:var(--card2);border:1px solid var(--line)}
.bubblewrap{min-width:0}
.chatname{font-size:11px;color:var(--txt3);margin-bottom:3px}
.bubble{background:var(--card);border:1px solid var(--line);border-radius:4px 12px 12px 12px;padding:8px 11px;font-size:13.5px;line-height:1.6;display:inline-block}
.bubble.intel{border-color:var(--violet)}
.post{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:11px}
.post .ph{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.post .pname{font-size:13px;font-weight:600}
.post .ptime{font-size:11px;color:var(--txt3);margin-left:auto}
.post .pbody{font-size:13.5px;line-height:1.7;color:var(--txt)}
.post .pmeta{margin-top:9px;font-size:11.5px;color:var(--txt3);display:flex;gap:16px}
.post.gua{border-color:var(--red)}
.post.gua .pname{color:var(--red)}

/* ---------- album ---------- */
.item{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px;margin-bottom:9px}
.item .thumb{flex:none;width:46px;height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:21px;background:var(--card2)}
.item .info{flex:1;min-width:0}
.item .iname{font-size:13.5px;font-weight:600;margin-bottom:2px}
.item .imeta{font-size:11px;color:var(--txt3)}
.item .sell{flex:none;border:1px solid var(--pink);background:none;color:var(--pink);border-radius:9px;padding:7px 12px;font-size:12.5px;cursor:pointer}
.item .sell:disabled{opacity:.35}
.lv1{color:var(--txt2)}.lv2{color:var(--blue)}.lv3{color:var(--violet)}.lv4{color:var(--gold)}.lv5{color:var(--red)}

/* ---------- mine ---------- */
.statrow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.statrow:last-child{border:none}
.statrow .k{color:var(--txt2)}
.mystery{color:var(--txt3);letter-spacing:2px}
.statnote{font-size:11.5px;color:var(--txt3);padding:0 0 8px;margin-top:-5px;border-bottom:1px solid var(--line);line-height:1.5}
.statnote:last-child{border:none}

/* ---------- summary ---------- */
.sumcard{background:var(--card);border:1px solid var(--violet);border-radius:14px;padding:16px;margin-bottom:12px}
.sumcard h4{font-size:13px;color:var(--violet);font-weight:700;margin-bottom:10px;letter-spacing:1px}
.sumrow{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line)}
.sumrow:last-of-type{border:none}
.sumrow .k{color:var(--txt2)}
.forecast{margin-top:10px;padding:10px;border-radius:10px;background:var(--card2);font-size:12.5px;line-height:1.7;color:var(--txt2)}
.forecast b{color:var(--gold)}

/* ---------- overlays ---------- */
.overlay{position:absolute;inset:0;background:#000c;backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:22px;z-index:50}
.modal{width:100%;max-height:86%;overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.modal h3{font-size:16px;margin-bottom:12px}
.endcard{text-align:center}
.endcard .etag{display:inline-block;font-size:11px;letter-spacing:3px;padding:4px 14px;border:1px solid var(--line);border-radius:99px;color:var(--txt3);margin-bottom:14px}
.endcard .etitle{font-size:24px;font-weight:800;margin-bottom:4px}
.endcard .esub{font-size:12px;color:var(--txt3);margin-bottom:16px}
.endcard .ebody{text-align:left;font-size:13.5px;line-height:1.9;color:var(--txt2);white-space:pre-wrap;margin-bottom:16px}
.endcard .estats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:18px}
.endcard .estat{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 13px;font-size:12px;color:var(--txt2)}
.endcard .estat b{display:block;font-size:16px;color:var(--txt);margin-bottom:1px}
.be .etitle{color:var(--red)} .te .etitle{color:var(--green)} .ge .etitle{color:var(--gold)} .ne .etitle{color:var(--txt2)}

/* ---------- start screen ---------- */
#start{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 0%,#1e1530 0%,var(--bg) 55%);z-index:60;display:flex;flex-direction:column;justify-content:center;padding:30px 26px;overflow-y:auto}
#start h1{font-size:34px;font-weight:900;letter-spacing:2px;margin-bottom:6px}
#start h1 span{color:var(--pink)}
#start .slogan{font-size:13px;color:var(--txt2);margin-bottom:26px;line-height:1.7}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--txt2);margin-bottom:6px}
.field input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px 13px;font-size:15px;color:var(--txt);outline:none}
.field input:focus{border-color:var(--pink)}
#start .tiny{font-size:10.5px;color:var(--txt3);line-height:1.7;margin-top:18px}
.fade{animation:fadein .45s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
</style>
</head>
<body>
<div id="phone">
  <div id="statusbar" style="display:none">
    <div id="sb-top">
      <span id="sb-day">DAY 1</span>
      <div id="sb-stats">
        <span>⚡<b id="sb-en">100</b></span>
        <span>💰<b id="sb-money">6000</b></span>
        <span>🌟<b id="sb-fame">无名</b></span>
      </div>
    </div>
    <div id="riskwrap">风险<div id="riskbar"><div id="riskfill"></div></div><span id="risknum">0 / 100</span></div>
  </div>
  <div id="statfloats"></div>
  <div id="screen"></div>
  <div id="morehint">⌄ 下滑查看选项</div>
  <div id="tabbar" style="display:none">
    <button class="tab on" data-tab="today"><span class="ti">🌃</span>今日<span class="dot" id="dot-today"></span></button>
    <button class="tab" data-tab="group"><span class="ti">💬</span>粉群<span class="dot" id="dot-group"></span></button>
    <button class="tab" data-tab="feed"><span class="ti">🔥</span>超话<span class="dot" id="dot-feed"></span></button>
    <button class="tab" data-tab="album"><span class="ti">📷</span>相册<span class="dot" id="dot-album"></span></button>
    <button class="tab" data-tab="mine"><span class="ti">👤</span>我的</button>
  </div>

  <div id="start">
    <h1>私生<span>模拟器</span></h1>
    <div class="slogan">你是一名游走在灰色地带的代拍。<br>行程、蹲点、快门、快钱——<br>每一步都在问你：见好就收，还是再赌一把？</div>
    <div class="field"><label>他的名字（你追的那个人）</label><input id="in-idol" maxlength="12" placeholder="随便填，比如：林屿声"></div>
    <div class="field"><label>团名（可不填，默认「星轨少年团」）</label><input id="in-group" maxlength="14" placeholder="星轨少年团"></div>
    <div class="field"><label>你的圈内代号</label><input id="in-alias" maxlength="10" placeholder="比如：山顶老灯"></div>
    <button class="btn primary" id="btn-new" style="margin-top:10px;text-align:center">开始追逐</button>
    <button class="btn ghost" id="btn-continue" style="display:none">继续上次的存档</button>
    <div class="tiny">本游戏纯属虚构，所有角色均为虚构的成年人物，与任何现实人物无关。游戏内一切行为皆有代价，请勿在现实中模仿。</div>
  </div>
</div>

<script>
"use strict";
/* =====================================================
   私生模拟器 v2 - 单文件 H5
   核心改动：偶像日程系统 / 远征弧线 / 日结面板 / 滚动锚定
   ===================================================== */

// ---------------- utils ----------------
const $=s=>document.querySelector(s);
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const chance=p=>Math.random()<p;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=n=>n.toLocaleString("zh-CN");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---------------- static data ----------------
const SAVE_KEY="ssim_save_v2", END_KEY="ssim_endings_v1";
const CITIES=["成都","长沙","海口","青岛","重庆","厦门","杭州","西安"];
const ROLES=["主唱","主舞","Rapper 担当","门面担当","队长","忙内"];
const PERSONAS=[
  {n:"温柔可靠型",desc:"对粉丝永远耐心，营业从不敷衍"},
  {n:"阳光犬系",desc:"舞台下笑起来眼睛弯弯，路透永远在比心"},
  {n:"高冷猫系",desc:"话不多，营业时常被说「眼神没有光」"},
  {n:"活泼话痨",desc:"直播能一个人撑两小时，团粉的快乐源泉"},
  {n:"腼腆害羞",desc:"被夸会耳根发红，粉丝最爱逗他"},
];
const SECRETS=[
  {id:"feud",n:"团内失和",clues:[
    "练习室路透里，他和队长隔了整整一排的距离，全程没有对视。",
    "庆功宴散场，队员们勾肩搭背，他一个人先上了保姆车。",
    "你拍到他在后台对着队长的背影欲言又止，最后只是扯了下嘴角。",
    "群里流传一段删掉的直播切片：队长开玩笑揽他肩膀，他几不可察地躲了一下。",
    "深夜的公司楼下，他和队长隔着一辆车争执，声音压得很低，但谁都没让步。"
  ],ending:"那对粉丝口中的「双子星」，私下已经两年没说过一句整话了。"},
  {id:"burnout",n:"濒临崩溃",clues:[
    "凌晨两点的练习室还亮着灯，窗影里那个反复重来的人是他。",
    "你拍到他在车里靠着窗睡着，手里还攥着没吃完的面包。",
    "签售时他笑得很标准，但你镜头里的他，眼下的乌青遮瑕都盖不住了。",
    "他在天台抽风口站了很久，什么都没做，就只是站着。",
    "你听见经纪人在电话里说：「他再这样下去会垮的，行程必须砍。」"
  ],ending:"镜头里永远发光的少年，私下已经在悬崖边走了很久。"},
  {id:"solo",n:"暗中筹备单飞",clues:[
    "他的背包侧袋里露出半本五线谱，封皮写着潦草的英文缩写。",
    "深夜他独自进了一家小录音棚，三个小时后才出来。",
    "你拍到他和一个不属于公司的音乐制作人在咖啡店压低声音聊了很久。",
    "他手机备忘录被路透拍到一角：「demo 7 / 合约 2027.3 到期」。",
    "圈内代拍传：有新厂牌在接触他，价码大到公司压不住。"
  ],ending:"合约到期那天，他会带着写了三年的歌离开这个团。"},
  {id:"love",n:"隐秘恋情",clues:[
    "他口罩上方的眼睛在机场扫过人群，最后落在一个不举灯牌的女生身上。",
    "你拍到他的车在同一个老小区楼下停过三次，每次都熄火很久。",
    "他手腕上多了一条很旧的红绳，公演服都遮不住，造型师拗不过他。",
    "情人节凌晨，他的小号给一首十年前的老情歌点了赞。",
    "深夜便利店，他买了两份关东煮，上车前回头望了一眼楼上的灯。"
  ],ending:"原来他什么都懂——被人藏起来、又怕被发现的感觉，他比谁都熟。"},

// ---------------- schedule ----------------
function ensureSchedule(upToDay){
  while(S.sched.length<upToDay){
    const last=S.sched.length?S.sched[S.sched.length-1].phase:null;
    let phase;
    if(S.sched.length===0){
      phase=pick(["practice","shoot"]); // 开局保证有事可做
    }else{
      const pool=[];
      const add=(p,w)=>{if(p!==last)for(let i=0;i<w;i++)pool.push(p);};
      add("practice",3);add("shoot",3);add("trip",3);add("comeback",2);add("rest",2);
      phase=pick(pool);
    }
    const len={rest:rnd(2,3),practice:rnd(2,3),shoot:rnd(2,3),trip:rnd(3,4),comeback:rnd(4,5)}[phase];
    const city=phase==="trip"?pick(CITIES):"";
    for(let i=0;i<len;i++)S.sched.push({phase,idx:i,len,city});
    if(phase==="comeback"&&S.sched.length>=16&&!S.concertPlanned){
      S.sched.push({phase:"concert",idx:0,len:1,city:""});
      S.concertPlanned=true;
    }
  }
}
function phaseOf(day){ensureSchedule(day+3);return S.sched[day-1];}

function phaseBrief(){
  const p=phaseOf(S.day);
  if(p.phase==="rest")return pick([
    "公司这两天没排行程，他在休整。圈子里很安静，安静得让人手痒。",
    "休整期。大站们都在清库存修图，行程贩子也没货可卖。"]);
  if(p.phase==="practice")return pick([
    "练习周期。他几乎住在练习室，公司楼下成了固定蹲点。",
    "这周在练新歌，凌晨的练习室灯总是最后一个灭。"]);
  if(p.phase==="shoot")return "他在本市进组录制，剧组行程相对规律——对你们这行来说，规律就是机会。";
  if(p.phase==="comeback")return '<span class="em">新歌宣传期！</span>剧场公演、卫视晚会、音乐节连轴转，超话热度起飞——这几天的图能卖出平时一倍半的价（素材溢价 30%）。';
  if(p.phase==="concert")return '<span class="em">今晚是演唱会！</span>圈内所有大站倾巢出动，一年里最大的「行情日」。';
  // trip
  if(p.idx===0)return "他今天飞<b>"+p.city+"</b>，跟队航班的消息已经在小群里传开了。";
  if(p.idx===p.len-1)return "他今天从<b>"+p.city+"</b>回来，落地时间已经流出。";
  return "他在<b>"+p.city+"</b>，本市没有行程。"+(S.away?"而你，就在这座城市里。":"要不要飞过去，还是趁机过几天正常日子？");
}
function phaseForecast(day){
  const p=phaseOf(day);
  const m={rest:"明天好像没什么行程，他应该在休息。",
    practice:"线人说他明天还在练习室泡着，公司楼下能蹲。",
    shoot:"明天剧组照常开工，录制点有机会。",
    comeback:"明天还有公演场子，新歌期的图依旧好卖（溢价 30%）。",
    concert:"⚡ 明晚是演唱会！留好钱，这是大日子。"};
  if(p.phase!=="trip")return m[p.phase];
  if(p.idx===0)return "⚡ 明天他要飞"+p.city+"——跟，还是不跟？";
  if(p.idx===p.len-1)return "明天他从"+p.city+"回来，接机口会很热闹。";
  return "明天他还在"+p.city+"，本市无行程。";
}

// ---------------- derived ----------------
function fameRank(f){let r=FAME_RANKS[0][1];for(const [t,n] of FAME_RANKS){if(f>=t)r=n;}return r;}
function impLevel(){const xp=S.impXP;return xp>=15?3:xp>=9?2:xp>=4?1:0;}
function freshness(item){return clamp(1-0.15*(S.day-item.day),0.3,1);}
function itemPrice(item){
  let p=LV_INFO[item.lv].base*(1+S.fame/100)*freshness(item);
  p*=(S.market&&S.market.mult)||1;
  if(item.shared)p*=0.4;     // 分享进群的图，全圈都有了
  if(item.published)p*=0.5;  // 发过超话的图，不再独家
  if(S.flags.black80)p*=0.5;
  return Math.round(p/10)*10;
}
function rollMarket(){
  const ph=phaseOf(S.day).phase;
  if(S.marketForce){S.market=S.marketForce;S.marketForce=null;return;}
  const r=Math.random();
  if(ph==="comeback")S.market={mult:1.3,label:"新歌宣传期",icon:"🔥",desc:"全圈流量高峰，素材溢价 30%"};
  else if(ph==="concert")S.market={mult:1.4,label:"演唱会日",icon:"🎤",desc:"现场图供不应求，溢价 40%"};
  else if(r<0.10)S.market={mult:1.5,label:"全网吃瓜日",icon:"🍉",desc:"隔壁家塌了，全圈流量暴涨，素材溢价 50%"};
  else if(r<0.20)S.market={mult:0.7,label:"平台严打",icon:"🧊",desc:"清查买卖生图，收图的全缩了，图价 -30%"};
  else if(r<0.28)S.market={mult:1.2,label:"物料荒",icon:"📭",desc:"他好几天没露面，群友嗷嗷待哺，图价 +20%"};
  else S.market={mult:1,label:"行情平稳",icon:"〰️",desc:"图价正常"};
}

// 资金永不为负：扣费时最多扣到 0（兜里只有这么多）
function addMoney(n){
  const before=S.money;
  S.money=Math.max(0,S.money+n);
  if(n>0)S.stats.earned+=n;
  else S.stats.spent+=before-S.money;
  const d=S.money-before;
  if(d!==0){statFloat((d>0?"+":"-")+"¥"+fmt(Math.abs(d)),d>0);pulseStat("#sb-money",d>0);}
  refreshBar();
}
function addRisk(n){
  const before=S.risk;
  S.risk=clamp(S.risk+n,0,100);S.stats.maxRisk=Math.max(S.stats.maxRisk,S.risk);
  const d=S.risk-before;
  if(Math.abs(d)>=3)statFloat("风险 "+(d>0?"+":"")+d,d<0);
  refreshBar();
}
function addChenlun(n){S.chenlun=clamp(S.chenlun+n,0,100);}
function addFame(n){S.fame=clamp(S.fame+n,0,100);refreshBar();}
function addEnergy(n){
  const before=S.energy;
  S.energy=clamp(S.energy+n,0,100);
  const d=S.energy-before;
  if(d!==0){statFloat("体力 "+(d>0?"+":"")+d,d>0);pulseStat("#sb-en",d>0);}
  refreshBar();
}
function addImp(n){
  const before=impLevel(); S.impXP+=n; const after=impLevel();
  S.impression=after;
  return after>before?after:0;
}

const todayEl=document.createElement("div");

// ---------------- scene engine（滚动锚定） ----------------
// 选择/新一天之后，下一个推入的内容块成为「锚点」：滚动到它的顶部而不是底部
let anchorNext=false, anchorEl=null;

function scrollToEl(el){
  const sc=$("#screen");
  const top=el.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop - 8;
  sc.scrollTop=Math.max(0,top);
}
function pushBlock(el){
  todayEl.appendChild(el);
  if(curTab!=="today")return;
  const sc=$("#screen");
  if(anchorNext){
    anchorNext=false; anchorEl=el;
    requestAnimationFrame(()=>{scrollToEl(el);});
  }else if(!anchorEl){
    requestAnimationFrame(()=>{sc.scrollTop=sc.scrollHeight;});
  }
}
function narrHTML(t){return '<div class="card fade"><div class="narr">'+t+'</div></div>';}
function pushNarr(html){
  const d=document.createElement("div"); d.innerHTML=narrHTML(html);
  pushBlock(d.firstChild);
}
function pushSys(t){
  const d=document.createElement("div"); d.innerHTML='<div class="sys fade">— '+esc(t)+' —</div>';
  pushBlock(d.firstChild);
}
function pushDelta(lines){
  if(!lines||!lines.length)return;
  const d=document.createElement("div");
  d.className="card fade"; d.innerHTML='<div class="delta">'+lines.join("<br>")+"</div>";
  pushBlock(d);
}

let choiceBox=null;
function showChoices(choices,qte,title){
  removeChoices();
  choiceBox=document.createElement("div"); choiceBox.className="choices fade";
  const t=document.createElement("div"); t.className="ctitle";
  t.textContent=title||"❯ 你的选择"; choiceBox.appendChild(t);
  if(qte){
    const q=document.createElement("div"); q.id="qtewrap";
    q.innerHTML='<div class="qtelabel">⚠ 快速反应 ⚠</div><div id="qtebar"><div id="qtefill" style="animation:qte '+qte.seconds+'s linear forwards"></div></div>';
    choiceBox.appendChild(q);
    qteTimer=setTimeout(()=>{ pushSys("你愣住了，没来得及反应"); takeChoice(choices[qte.timeoutIndex]); },qte.seconds*1000);
  }
  for(const c of choices){
    if(c.divider!==undefined){
      const d=document.createElement("div"); d.className="cgroup"; d.textContent=c.divider;
      choiceBox.appendChild(d); continue;
    }
    if(c.done!==undefined){
      const d=document.createElement("div"); d.className="doneline"; d.innerHTML="✓ <b>"+esc(c.done)+"</b>"+(c.doneSub?" · "+esc(c.doneSub):"");
      choiceBox.appendChild(d); continue;
    }
    const b=document.createElement("button"); b.className="btn"+(c.primary?" primary":"")+(c.ghost?" ghost":"");
    let subHtml=c.sub?esc(c.sub):"";
    if(c.disabled&&c.lock)subHtml='<span class="lock">⛔ '+esc(c.lock)+'</span>'+(c.sub?' · '+esc(c.sub):"");
    b.innerHTML=esc(c.label)+(subHtml?'<span class="sub">'+subHtml+"</span>":"");
    if(c.disabled){b.disabled=true;}
    else b.onclick=()=>takeChoice(c);
    choiceBox.appendChild(b);
  }
  todayEl.appendChild(choiceBox);
  // 选项不强制滚动：保持玩家在锚点位置阅读；选项在屏幕外时给出提示
  if(curTab==="today"&&!anchorEl){
    const sc=$("#screen");
    requestAnimationFrame(()=>{sc.scrollTop=sc.scrollHeight;});
  }
  requestAnimationFrame(updateMoreHint);
}
// 把已读内容压暗，让「现在」一目了然
function dimPast(){
  for(const ch of todayEl.children)ch.classList.add("past");
}
function pushReceipt(label){
  const d=document.createElement("div");
  d.className="receipt"; d.innerHTML="<span>"+esc(label)+"</span>";
  pushBlock(d);
}
function takeChoice(c){
  if(sceneLock)return; sceneLock=true;
  if(qteTimer){clearTimeout(qteTimer);qteTimer=null;}
  removeChoices();
  dimPast();
  anchorNext=true; anchorEl=null;
  if(!c.silent)pushReceipt(c.label);
  setTimeout(()=>{sceneLock=false; c.fn&&c.fn();},60);
}
function removeChoices(){ if(choiceBox){choiceBox.remove();choiceBox=null;} updateMoreHint(); }
// 「下滑查看选项」浮动提示
function updateMoreHint(){
  const hint=$("#morehint"); if(!hint)return;
  let show=false;
  if(choiceBox&&curTab==="today"&&!S?.ended){
    const sc=$("#screen");
    const r=choiceBox.getBoundingClientRect(), sr=sc.getBoundingClientRect();
    if(r.top>sr.bottom-60)show=true;
  }
  hint.classList.toggle("show",show);
}
$("#morehint").onclick=()=>{
  if(choiceBox)scrollToEl(choiceBox);
  $("#morehint").classList.remove("show");
};
$("#screen").addEventListener("scroll",()=>requestAnimationFrame(updateMoreHint),{passive:true});

function startDay(){
  S.day++; S.stats.days=S.day;
  S.itemsToday=0; S.todayPenalty=false; S.commission=null; S.awayShotToday=false; S.feedAct=null;
  addEnergy(60);
  ensureSchedule(S.day+3);
  S.snap={money:S.money,risk:S.risk,shots:S.stats.shots};
  // 群地位：昨天没冒泡就掉，掉到 0 被踢
  let justKicked=false;
  if(S.day>1&&!S.kicked){
    if(!S.repActed)S.rep=Math.max(0,S.rep-4);
    if(S.rep<=0){S.kicked=true;justKicked=true;}
  }
  S.repActed=false;
  rollMarket();
  genIntel(); genGroupMsgs(); genFeed();
  markDot("group"); markDot("feed");
  refreshBar(); save();

  todayEl.innerHTML="";
  anchorNext=true; anchorEl=null; // 新一天：锚定到第一条内容，从头读起
  pushSys("DAY "+S.day+" · "+["晴","多云","小雨","阴","降温","闷热"][rnd(0,5)]);
  if(justKicked)pushNarr('<span class="warn">📵 你被移出了「'+esc(S.idol.name)+'唯爱小分队」。</span><br>没有任何预告，群聊界面变成了灰色的「你已不在该群中」。潜水太久的人，第一批被清理。<br><span class="hint">免费线报渠道断了。去粉群页想办法回去吧。</span>');

  // 远征归来
  if(S.away&&phaseOf(S.day).phase!=="trip"){
    S.away=false;
    const back=Math.min(rnd(8,15)*100,Math.max(S.money,0));
    addMoney(-back);
    if(back<800)pushNarr('行程结束。你的余额买不起正经机票，捡了张凌晨红眼航班的特价票，把自己折叠在最后一排飞了回来（-¥'+fmt(back)+'）。');
    else pushNarr('行程结束，你跟着回程的人流飞回了本市（机票 -¥'+fmt(back)+'）。');
    if(chance(0.4)){gainItem(2,"回程机舱图","隔着两排座位的侧影");pushSys("回程顺手又拍了几张");}
  }

  // GPS 定位器状态
  if(S.gpsUntil){
    if(S.day>S.gpsUntil){
      S.gpsUntil=0;
      pushNarr('<span class="hint">📍 App 上的小红点不动了——定位器没电了。三天的全知视角到此为止，你盯着灰掉的图标，居然有点戒断反应。</span>');
    }else if(chance(0.18)){
      S.gpsUntil=0; addRisk(15); addImp(1);

function morningEvent(){
  if(!chance(0.5))return morningBrief();
  const pool=[];
  for(const e of MORNING_EVENTS){if(e.cond&&!e.cond())continue;for(let i=0;i<e.w;i++)pool.push(e);}
  if(!pool.length)return morningBrief();
  pick(pool).run();
}

function morningBrief(){
  pushNarr('📅 '+phaseBrief());
  if(!S.away){
    let html='今天的圈内风声：';
    if(S.intel.length===0)html+='<br><span class="hint">没有任何可靠行程流出。要么休息，要么去碰碰运气以外的事。</span>';
    else for(const it of S.intel){
      html+='<br>· <b>'+it.title+'</b> <span class="hint">'+it.src+'</span>';
    }
    pushNarr(html);
  }
  actionMenu();
}

// ---------------- intel ----------------
function genIntel(){
  S.intel=[];
  if(S.away)return;
  const p=phaseOf(S.day);
  const mk=(type,sub,title,forceFree,realBase)=>{
    const paid=forceFree?false:chance(0.5);
    let acc=realBase!==undefined?realBase:(paid?0.9:0.65);
    if(S.flags.watch60)acc-=0.15;
    if(S.dryDays>=2)acc=Math.max(acc,0.95);
    const cost=paid?(type==="airport"?rnd(4,10)*100:type==="hotel"?rnd(6,15)*100:rnd(2,6)*100):0;
    S.intel.push({type,sub:sub||"",title,src:paid?"（收费线报 ¥"+cost+"，准度高）":"（粉群免费瓜，真假难说）",
      cost,bought:!paid,real:chance(acc),used:false});
  };
  if(p.phase==="rest"){
    if(chance(0.35))mk("hotel","","今晚他常去的那家深夜健身房，有人看到熟悉的车");
    else if(chance(0.45))mk("studio","practice","他今天可能会回公司处理事务，楼下能蹲");
  }else if(p.phase==="practice"){
    if(chance(0.8))mk("studio","practice",pick(["他今晚在练习室加练，老地方","公司楼下，下班时间大概十一点","今天有声乐课，下午进公司"]));
    if(chance(0.3))mk("hotel","","练完他们常去那家烤肉店，今晚可能聚餐");
  }else if(p.phase==="shoot"){
    if(chance(0.85))mk("studio","shoot",pick(["剧组今天在西郊基地开工，下午进场","录制基地侧门，设备车一早就进去了","今天夜戏，收工时间未知"]));
    if(chance(0.45))mk("hotel","","剧组下榻酒店的定位流出了：城东那家");
  }else if(p.phase==="comeback"){
    if(chance(0.85))mk("show","",pick(["今晚剧场有公演，后门凌晨就有人占位了","下午录卫视晚会，艺人通道在北侧","今天音乐节行程，下午彩排进场","今晚团播直播，公司楼下设备车已就位"]));
    if(chance(0.4))mk("hotel","","新歌期他们统一住公司附近的酒店");
  }else if(p.phase==="trip"){
    if(p.idx===0)mk("airport","dep","今天下午他飞"+p.city+"，值机时间已在小群流传",false,0.95);
    else if(p.idx===p.len-1)mk("airport","arr","他今天从"+p.city+"回来，落地时间已流出",false,0.9);
  }else if(p.phase==="concert"){
    S.intel.push({type:"concert",sub:"",title:"今晚 19:30 演唱会，场馆外下午就会开始堵人",src:"（官宣行程，绝对真实）",cost:0,bought:true,real:true,used:false});
  }
  // 行程黑产被严打期间：收费线报涨价 50%
  if(S.intelSurgeUntil&&S.day<=S.intelSurgeUntil){
    for(const it of S.intel){if(!it.bought&&it.cost){it.cost=Math.round(it.cost*1.5/10)*10;it.src="（严打期渠道紧张 ¥"+it.cost+"，准度高）";}}
  }
  // 被踢出群：免费瓜全断（演唱会官宣行程除外）
  if(S.kicked)S.intel=S.intel.filter(it=>it.cost>0||it.type==="concert");
  // 群内大佬：收费线报八折
  if(S.rep>=70){
    for(const it of S.intel){if(!it.bought&&it.cost){it.cost=Math.round(it.cost*0.8/10)*10;it.src="（群内熟人价 ¥"+it.cost+"，准度高）";}}
  }
  // GPS 定位器：期间所有情报为真且免费
  if(S.gpsUntil&&S.day<=S.gpsUntil){
    for(const it of S.intel){it.real=true;it.bought=true;it.cost=0;it.src='（📍 GPS 轨迹比对，绝对真实）';}
  }
}

function eveEvent(){
  if(!S.flags.evDone)S.flags.evDone=[];
  const pool=[];
  for(const e of EVE_EVENTS){
    if(e.minDay&&S.day<e.minDay)continue;
    if(e.once&&S.flags.evDone.includes(e.id))continue;
    if(e.cond&&!e.cond())continue;
    for(let i=0;i<e.w;i++)pool.push(e);
  }
  if(!pool.length)return nightOffer();
  const ev=pick(pool);
  if(ev.once)S.flags.evDone.push(ev.id);
  ev.run();
}

function endDay(rested){
  removeChoices();
  if(rested)return settleDay();
  // 前期世界平淡，越往后夜越长
  const p=S.day<4?0.12:S.day<8?0.25:0.36;
  if(chance(p))return eveEvent();
  nightOffer();
}
function nightOffer(){
  const lv4s=S.inventory.filter(i=>i.lv>=4);
  if(lv4s.length&&chance(0.3)){
    const it=pick(lv4s); const offer=Math.round(itemPrice(it)*1.8/10)*10;
    pushNarr('🌙 深夜，一个陌生账号私聊了你：<br>「'+esc(it.name)+'，听说在你手里。<b>¥'+fmt(offer)+'</b>，现结，不问来源不留记录。考虑一下？」');
    showChoices([
      {label:"出手。钱不烫手",sub:"+¥"+fmt(offer)+" · 沉沦+8 · 风险+8",fn(){
        addMoney(offer); addChenlun(8); addRisk(8);
        if(it.lv>=4)S.flags.soldLv4++;
        S.inventory=S.inventory.filter(x=>x.id!==it.id);
        pushSys("素材已发出，对方秒结了款。你删掉了聊天记录");
        settleDay();
      }},
      {label:"拒绝，拉黑",sub:"沉沦-2",fn(){
        addChenlun(-2);
        pushSys("你拉黑了对方。但那个数字在你脑子里停了很久");
        settleDay();
      }},
    ]);
    return;
  }
  settleDay();
}
function settleDay(){
  if(S.itemsToday===0)S.dryDays++;
  let lodging=0;
  if(S.away){
    lodging=Math.min(250,S.money);
    if(S.money<250)pushSys("外地住宿把你兜里最后一点零钱刮干净了，老板娘摆摆手说差的算了");
    addMoney(-250);
  }
  if(checkHardEndings())return;
  if(S.day>=S.flags.signingDay){S.flags.signingDay=S.day+rnd(8,12);}
  if(S.day>=40&&S.fame>=60&&!S.flags.everLv4&&!S.flags.faceEvent){
    return ending("ge_zhanjie");
  }
  daySummary(lodging);
}
function daySummary(lodging){
  const dMoney=S.money-S.snap.money;
  const dRisk=S.risk-S.snap.risk;
  const dShots=S.stats.shots-S.snap.shots;
  const card=document.createElement("div");
  card.className="sumcard fade";
  const sign=(n,inv)=>{
    if(n===0)return '<span class="k">±0</span>';
    const good=inv?n<0:n>0;
    return '<span class="'+(good?"up":"down")+'">'+(n>0?"+":"")+fmt(n)+'</span>';
  };
  card.innerHTML='<h4>📋 DAY '+S.day+' 日结</h4>'
    +'<div class="sumrow"><span class="k">今日收支</span>'+sign(dMoney)+'</div>'
    +'<div class="sumrow"><span class="k">风险变化</span>'+sign(dRisk,true)+'</div>'
    +'<div class="sumrow"><span class="k">新增素材</span><span>'+dShots+' 份</span></div>'
    +'<div class="sumrow"><span class="k">库存素材</span><span>'+S.inventory.length+' 份（记得去相册卖，会掉新鲜度）</span></div>'
    +(lodging?'<div class="sumrow"><span class="k">外地住宿</span><span class="down">-¥'+lodging+'</span></div>':"")
    +'<div class="forecast">🔮 <b>明日风向</b><br>'+phaseForecast(S.day+1)+'</div>';
  dimPast();
  anchorNext=true; anchorEl=null;
  pushBlock(card);
  save();
  showChoices([{label:"🌅 进入下一天",primary:true,silent:true,fn:()=>startDay()}],null,"📋 今日结算");
}
function checkHardEndings(){
  if(S.risk>=100){ending("be_jail");return true;}
  if(S.chenlun>=100){ending("be_sink");return true;}
  return false;
}

    {name:"理智追星bot",body:"再说一次：私生不是粉丝。跟机、堵酒店的没资格自称喜欢他。",icon:"🧊"},
    {name:"代拍接单",body:"接今日图，可指定机位，老规矩私",icon:"📷"},
  ];
  if(ph==="comeback")pool.push({name:"打榜战报",body:"新歌首周！"+S.idol.name+"公演直拍播放量断层第一，再接再厉！",icon:"🏆"},{name:"前线速报",body:"今晚公演舞台直拍已出，新造型杀疯了",icon:"🎵"});

function publishStation(id){
  const it=S.inventory.find(x=>x.id===id); if(!it||it.published)return;
  it.published=true;
  const gain=it.lv*it.lv*rnd(25,60);
  const oldFans=S.stationFans;
  S.stationFans+=gain;
  addFame(it.lv>=4?7:it.lv>=3?4:2);
  let msg="超话发布「"+it.name+"」：站子涨粉 "+fmt(gain)+"（该图不再独家，卖价减半）";
  if(it.lv>=4){
    addRisk(10); S.evidence++;
    msg+=" · 非公开素材引爆全网，公司的人来你主页逛过了（风险+10）";
  }
  pushSys(msg);
  // 涨粉里程碑：商务约稿
  for(const t of [1000,3000,8000]){
    if(oldFans<t&&S.stationFans>=t){
      const r=t===1000?800:t===3000?2000:5000;
      addMoney(r);
      pushSys("🎉 站子粉丝破 "+fmt(t)+"！品牌物料组找你约稿，结款 ¥"+fmt(r));
    }
  }
  save(); renderFeed($("#screen"));
}

        addChenlun(5);pushSys("你跟着骂了一句「私生去死」。发送成功的瞬间，你的手指有点凉");

        addChenlun(-2);pushSys("你沉默地划过了那条帖子。帖子里的每一条罪状，你都做过");

        if(S.money<300){S.feedAct.done=false;pushSys("余额不足 ¥300");return;}
        addMoney(-300);addFame(3);S.rep=Math.min(100,S.rep+3);S.repActed=true;addChenlun(2);

      }else if(a==="freevote"){

        pushSys("你甩出「"+it2.name+"」：「爆料说的那个时间，他在这。」时间线对死，谣言两小时崩盘。站子被夸「救场真神」");
      }else if(a==="rspread"){
        addChenlun(4);S.marketForce={mult:1.5,label:"全网吃瓜日",icon:"🍉",desc:"恋情瓜发酵，全圈流量暴涨，素材溢价 50%"};
        pushSys("你换小号添油加醋转了一手。瓜越滚越大——明天全圈都在吃瓜，图价看涨。你看着热搜，有种奇怪的掌控感");
      }else if(a==="rignore"){
        addChenlun(-1);pushSys("你没理。当晚工作室发了律师函，瓜不攻自破。你早就知道是假的——那晚他在哪，你比谁都清楚");
      }else if(a==="expose"){
        addFame(5);addRisk(2);S.stationFans+=rnd(80,250);
        pushSys("你发了逐帧水印对比图，大粉排队转发。盗图贼连夜删帖跑路，你站子涨了一波「正义路人粉」");
      }else if(a==="blackmail"){
        addMoney(400);addChenlun(3);

      }else if(a==="letgo"){
        addChenlun(-1);pushSys("你懒得撕。图这种东西，发出去就不是自己的了——这个道理你比谁都懂");
      }else if(a==="bbsell"){
        const it3=S.inventory.find(x=>x.id===+b.dataset.bb);

        else pushSys("「"+it3.name+"」以 ¥"+fmt(bp)+" 现结卖出。买断价就是痛快");

}

function renderAlbum(sc){
  let h="";
  if(S.idol.cluesFound>0){
    const sec=SECRETS.find(x=>x.id===S.idol.secret);
    h+='<div class="card"><h4>🧩 线索 · 他的秘密（'+S.idol.cluesFound+'/5）</h4>';
    for(let i=0;i<S.idol.cluesFound;i++)h+='<div class="narr" style="font-size:13px;margin-bottom:8px"><span class="hint">'+esc(sec.clues[i])+'</span></div>';
    if(S.flags.secretDone)h+='<div class="narr" style="font-size:13.5px"><span class="em">真相：'+esc(sec.ending)+'</span></div>';
    h+="</div>";
  }
  const mk2=S.market||{mult:1};
  const buff=mk2.mult!==1?'<div class="sys" style="color:'+(mk2.mult>1?'var(--gold)':'var(--txt3)')+'">'+mk2.icon+' '+mk2.label+'：'+mk2.desc+'</div>':"";
  h+=buff+'<div class="sys">素材库 · 卖出 4 级以上素材会有代价</div>';
  if(!S.inventory.length)h+='<div class="sys" style="margin-top:30px">空空如也。去蹲点吧。</div>';
  for(const it of [...S.inventory].reverse()){
    const inf=LV_INFO[it.lv], price=itemPrice(it), fr=Math.round(freshness(it)*100);
    h+='<div class="item fade"><div class="thumb">'+inf.icon+'</div><div class="info"><div class="iname"><span class="lv'+it.lv+'">Lv'+it.lv+' '+inf.n+'</span> · '+esc(it.name)+'</div><div class="imeta">'+esc(it.desc)+' · 新鲜度 '+fr+'%</div></div><button class="sell" data-id="'+it.id+'">¥'+fmt(price)+'</button></div>';
  }
  sc.innerHTML=h;
  sc.querySelectorAll(".sell").forEach(b=>{
    b.onclick=()=>sellItem(+b.dataset.id);
  });
}
function sellItem(id){
  const it=S.inventory.find(x=>x.id===id); if(!it)return;
  const price=itemPrice(it);
  addMoney(price); addFame(it.lv>=4?8:it.lv===3?3:1);
  let extra="";
  if(it.lv>=4){addChenlun(it.lv===5?12:6);addRisk(5);S.flags.soldLv4++;S.evidence++;extra="（这种货流通出去，迟早被溯源）";}
  else if(it.lv===3&&/行程|信息|房号/.test(it.name)){addChenlun(5);extra="（你成了行程产业链的一环）";}
  S.inventory=S.inventory.filter(x=>x.id!==id);
  save();
  renderAlbum($("#screen"));
  pushSys("卖出「"+it.name+"」 +¥"+fmt(price)+" "+extra);
  if(checkHardEndings())return;
}

function impDesc(){
  if(S.flags.faceEvent)return["💔 他当面求过你了","那天之后，你们之间只剩下安保的距离"];
  return[
    null,
    ["😶 有点眼熟","收工时他的视线在你脸上停过半秒。大概是错觉吧"],
    ["😨 记住了你的脸","看到你时，他会下意识把帽檐压得更低"],
    ["🥶 警惕与厌恶","他看你的眼神没有温度。那不是看粉丝的眼神，是看麻烦的眼神"],
  ][impLevel()];
}
function chenDesc(){
  const c=S.chenlun;
  if(c>=90)return["🌑 深渊边缘","再往前一步，就再也找不回自己了"];
  if(c>=70)return["⛈ 病入膏肓","你已经很久没有梦了。世界缩小成了一个人的坐标"];
  if(c>=40)return["🌧 沦陷","你想不起上次和朋友吃饭是什么时候，但记得他这周每天的行程"];
  if(c>=15)return["🌤 上头","钱和时间都在悄悄倾斜。你管这叫「热爱」"];
  return["☀️ 清醒","你还分得清，什么是生活，什么是爱好"];
}

  const imp=impDesc(), chen=chenDesc();
  let h='<div class="card"><h4>👤 '+esc(S.alias)+(S.away?'（远征中 · '+esc(S.awayCity)+'）':"")+'</h4>'
    +'<div class="statrow"><span class="k">资金</span><span>¥'+fmt(S.money)+'</span></div>'
    +'<div class="statrow"><span class="k">体力</span><span>'+S.energy+' / 100</span></div>'

    +'<div class="statrow"><span class="k">圈内知名度</span><span>'+fameRank(S.fame)+'</span></div>'
    +'<div class="statrow"><span class="k">装备</span><span>'+(S.gear?"📷 + 大白长焦":"📷 基础相机")+'</span></div>'
    +(imp
      ?'<div class="statrow"><span class="k">他对你的印象</span><span>'+imp[0]+'</span></div><div class="statnote">'+imp[1]+'</div>'
      :'<div class="statrow"><span class="k">他对你的印象</span><span class="mystery">？？？</span></div><div class="statnote">他还不知道你的存在。当他注意到你的那天，这一栏会解锁——但那未必是好事</div>')
    +'<div class="statrow"><span class="k">沉沦度</span><span>'+chen[0]+'</span></div><div class="statnote">'+chen[1]+'</div>'
    +'</div>';
  h+='<div class="card"><h4>🎤 关于他</h4>'
    +'<div class="statrow"><span class="k">姓名</span><span>'+esc(S.idol.name)+'</span></div>'
    +'<div class="statrow"><span class="k">团体</span><span>'+esc(S.idol.group)+'</span></div>'
    +'<div class="statrow"><span class="k">担当</span><span>'+esc(S.idol.role)+'</span></div>'
    +'<div class="statrow"><span class="k">人设</span><span>'+esc(S.idol.persona)+'</span></div>'
    +'<div class="statrow"><span class="k">他的秘密</span><span>'+(S.flags.secretDone?'<span class="em">已拼出</span>':S.idol.cluesFound+" / 5 线索")+'</span></div>'
    +'</div>';
  if(S.flags.keepsakes.length){
    h+='<div class="card"><h4>🎁 纪念品</h4>'+S.flags.keepsakes.map(k=>'<div class="statrow"><span class="k">'+esc(k)+'</span></div>').join("")+"</div>";
  }
  if(S.flags.faceEvent){
    h+='<button class="btn primary" id="btn-quit-te" style="text-align:center">退坑（他求过你了）</button>';
  }else{
    h+='<button class="btn ghost" id="btn-quit">退坑离场</button>';
  }
  h+='<button class="btn ghost" id="btn-reset">放弃本局，重新开始</button>';
  sc.innerHTML=h;
  const q1=sc.querySelector("#btn-quit-te"), q2=sc.querySelector("#btn-quit");
  if(q1)q1.onclick=()=>{
    if(S.day-S.flags.faceDay<=10&&S.chenlun<60)ending("te_return");
    else ending("ne_leave");
  };
  if(q2)q2.onclick=()=>{ if(confirm("现在退坑，故事就到这里了。确定吗？"))ending("ne_leave"); };
  sc.querySelector("#btn-reset").onclick=()=>{ if(confirm("本局进度将被清除。")){clearSave();location.reload();} };
}

function migrate(s){
  if(s.rep==null)s.rep=40;
  if(s.repActed==null)s.repActed=false;
  if(s.kicked==null)s.kicked=false;
  if(s.stationFans==null)s.stationFans=rnd(150,400);
  if(s.evidence==null)s.evidence=0;
  if(!s.market)s.market={mult:1,label:"行情平稳",icon:"〰️",desc:"图价正常"};
  if(s.marketForce===undefined)s.marketForce=null;
  if(s.feedAct===undefined)s.feedAct=null;
  if(s.daigouDue===undefined)s.daigouDue=0;
  if(s.signCount===undefined)s.signCount=0;
  if(!s.npc)s.npc={oxy:0,cat:0,lost:0,oxyDone:false,lostDone:false};
  if(!s.chain)s.chain={inspect:0,inspectDay:0,cleaned:false,disciple:0,discipleDay:0,discipleGood:false};
  return s;
}
function boot(state){
  S=migrate(state);
  $("#start").style.display="none";
  $("#statusbar").style.display="flex";
  $("#tabbar").style.display="flex";
  refreshBar();
  renderTab();
  if(S.day===0)startDay();
  else{
    todayEl.innerHTML="";
    pushSys("存档已恢复 · 从新的一天继续");
    startDay();
  }
}
(function init(){
  const old=loadSave();
  if(old&&!old.ended&&old.v===2){
    const b=$("#btn-continue"); b.style.display="block";
    b.onclick=()=>boot(old);
  }
  $("#btn-new").onclick=()=>{
    const idol=$("#in-idol").value.trim();
    const alias=$("#in-alias").value.trim();
    if(!idol){$("#in-idol").classList.add("shake");setTimeout(()=>$("#in-idol").classList.remove("shake"),450);$("#in-idol").focus();return;}
    if(!alias){$("#in-alias").classList.add("shake");setTimeout(()=>$("#in-alias").classList.remove("shake"),450);$("#in-alias").focus();return;}
    clearSave();
    boot(newState(idol, $("#in-group").value.trim()||"星轨少年团", alias));
  };
})();
